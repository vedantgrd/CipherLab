<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Classical Cryptography Suite</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#080f1e;--bg2:#0d1526;--surface:#111d30;--surface2:#162038;
    --surface3:#1a2640;--border:#1e3050;--border2:#243660;
    --primary:#38bdf8;--primary-dim:#0c3a5c;--primary-glow:#38bdf820;
    --success:#22c55e;--success-dim:#052e16;
    --warning:#f59e0b;--warning-dim:#1c1003;
    --danger:#ef4444;--danger-dim:#1f0606;
    --text:#f0f6ff;--text2:#8ea8c3;--text3:#4a6280;
    --mono:'JetBrains Mono',monospace;
    --sans:'Inter',sans-serif;
    --radius:10px;--radius-lg:16px;--radius-xl:20px;
    --shadow:0 4px 24px #00000040;
    --shadow-lg:0 8px 48px #00000060;
  }
  html,body,#root{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:var(--bg2)}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:var(--text3)}

  /* Layout */
  .app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:52px 1fr 30px;height:100vh}
  .topbar{grid-column:1/-1;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:10}
  .sidebar{grid-row:2;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
  .main{grid-row:2;overflow-y:auto;background:var(--bg)}
  .statusbar{grid-column:1/-1;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px;color:var(--text3)}

  /* Topbar */
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
  .breadcrumb .sep{color:var(--text3)}
  .breadcrumb .current{color:var(--text);font-weight:500}
  .topbar-right{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success)}

  /* Sidebar */
  .sidebar-logo{padding:20px 16px 12px;border-bottom:1px solid var(--border)}
  .sidebar-logo-title{font-size:15px;font-weight:800;color:var(--primary);letter-spacing:.5px}
  .sidebar-logo-sub{font-size:10px;color:var(--text3);font-weight:500;letter-spacing:1px;margin-top:2px; margin-left:17px}
  .sidebar-section-label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--text3);padding:16px 16px 6px;text-transform:uppercase}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-left:3px solid transparent;transition:all .15s;color:var(--text2);font-size:13px;font-weight:500;user-select:none}
  .nav-item:hover{background:var(--surface);color:var(--text)}
  .nav-item.active{border-left-color:var(--primary);background:var(--primary-glow);color:var(--primary);font-weight:600}
  .nav-icon{font-size:14px;width:18px;text-align:center}

  /* Dashboard */
  .page{padding:32px;max-width:1100px;margin:0 auto}
  .hero{margin-bottom:36px}
  .hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--primary);text-transform:uppercase;margin-bottom:8px}
  .hero-title{font-size:42px;font-weight:800;line-height:1.1;margin-bottom:12px;background:linear-gradient(135deg,#f0f6ff,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .hero-sub{font-size:16px;color:var(--text2);font-weight:400}
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:40px}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;text-align:center}
  .stat-value{font-size:32px;font-weight:800;color:var(--primary);font-family:var(--mono);line-height:1}
  .stat-label{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text3);margin-top:6px;text-transform:uppercase}
  .cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:32px}
  .cipher-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
  .cipher-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--border);transition:background .2s}
  .cipher-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 8px 32px #38bdf810}
  .cipher-card:hover::before{background:var(--primary)}
  .cipher-card-tag{display:inline-block;background:var(--primary-dim);color:var(--primary);font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:4px;margin-bottom:12px;text-transform:uppercase}
  .cipher-card-title{font-size:20px;font-weight:800;margin-bottom:4px}
  .cipher-card-type{font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--primary);text-transform:uppercase;margin-bottom:12px}
  .cipher-card-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px}
  .cipher-card-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border2);color:var(--text2);font-size:12px;font-weight:600;padding:7px 14px;border-radius:6px;cursor:pointer;transition:all .15s}
  .cipher-card:hover .cipher-card-btn{border-color:var(--primary);color:var(--primary)}

  /* Cipher page */
  .cipher-page{padding:28px 32px;max-width:1100px;margin:0 auto}
  .cipher-header{margin-bottom:28px}
  .cipher-header-row{display:flex;align-items:center;gap:16px;margin-bottom:6px}
  .cipher-title{font-size:30px;font-weight:800}
  .cipher-badge{background:var(--primary-dim);color:var(--primary);font-size:11px;font-weight:700;letter-spacing:.5px;padding:4px 12px;border-radius:20px;text-transform:uppercase}
  .cipher-desc{color:var(--text2);font-size:14px}
  .cipher-layout{display:grid;grid-template-columns:1fr 280px;gap:24px}
  .cipher-main{}
  .cipher-sidebar{}

  /* Cards */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:16px}
  .card-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .card-title{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase}
  .card-body{padding:16px}

  /* Operation toggle */
  .op-toggle{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border2);border-radius:8px;overflow:hidden}
  .op-btn{padding:9px;text-align:center;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.5px;background:var(--surface2);color:var(--text3);transition:all .15s;user-select:none}
  .op-btn.active{background:var(--primary);color:#000}
  .op-btn:not(.active):hover{background:var(--surface3);color:var(--text)}

  /* Inputs */
  .field{margin-bottom:14px}
  .field-label{font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--text2);margin-bottom:6px;display:block;text-transform:uppercase}
  .input{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:13px;padding:10px 12px;outline:none;transition:border-color .15s;resize:vertical}
  .input:focus{border-color:var(--primary)}
  .input::placeholder{color:var(--text3)}
  .input-sm{width:120px}
  .textarea{min-height:110px}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--sans);font-weight:700;font-size:13px;border:none;border-radius:8px;cursor:pointer;transition:all .15s;letter-spacing:.3px;user-select:none;outline:none;padding:10px 20px}
  .btn-primary{background:var(--primary);color:#000}
  .btn-primary:hover{background:#7dd3fc}
  .btn-ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border2)}
  .btn-ghost:hover{background:var(--surface3);color:var(--text);border-color:var(--border2)}
  .btn-sm{font-size:12px;padding:7px 14px}
  .btn-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* Textarea output */
  .output-box{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:12px;font-family:var(--mono);font-size:13px;min-height:110px;white-space:pre-wrap;word-break:break-all;line-height:1.7;color:var(--success)}
  .output-empty{color:var(--text3);font-style:italic}

  /* Banners */
  .banner{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
  .banner-error{background:var(--danger-dim);border:1px solid var(--danger);color:var(--danger)}
  .banner-success{background:var(--success-dim);border:1px solid var(--success);color:var(--success)}
  .banner-info{background:var(--primary-dim);border:1px solid var(--primary);color:var(--primary)}
  .banner-warning{background:var(--warning-dim);border:1px solid var(--warning);color:var(--warning)}

  /* Matrix display */
  .matrix-grid{display:inline-grid;gap:3px;margin:4px 0}
  .matrix-cell{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:600;border-radius:6px;background:var(--surface3);border:1px solid var(--border2);transition:all .2s}
  .matrix-cell.kw{background:var(--primary-dim);border-color:var(--primary);color:var(--primary)}

  /* Matrix editor */
  .matrix-editor{display:inline-grid;gap:4px}
  .matrix-input{width:52px;height:52px;text-align:center;background:var(--bg2);border:1px solid var(--border2);border-radius:6px;color:var(--primary);font-family:var(--mono);font-size:16px;font-weight:600;outline:none;transition:border-color .15s}
  .matrix-input:focus{border-color:var(--primary)}

  /* Key status */
  .key-status{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;margin-top:10px}
  .key-dot{width:8px;height:8px;border-radius:50%}
  .key-valid{color:var(--success)}.key-valid .key-dot{background:var(--success);box-shadow:0 0 6px var(--success)}
  .key-invalid{color:var(--danger)}.key-invalid .key-dot{background:var(--danger)}

  /* Steps / visualization */
  .steps-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;font-family:var(--mono);font-size:12px;line-height:1.9;white-space:pre-wrap;overflow-x:auto;max-height:420px;overflow-y:auto}
  .step-heading{color:var(--primary);font-weight:700;font-size:13px}
  .step-arrow{color:var(--success)}
  .step-key{color:var(--warning)}
  .step-dim{color:var(--text3)}
  .step-row{display:flex;gap:12px;padding:2px 0;border-bottom:1px solid var(--border)}
  .step-row:last-child{border-bottom:none}
  .step-col{min-width:50px}

  /* Vigenere alignment table */
  .vig-table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px}
  .vig-table td{padding:4px 6px;border:1px solid var(--border);text-align:center;min-width:28px}
  .vig-table .row-label{color:var(--text3);font-weight:600;text-align:left;padding-left:8px;background:var(--surface2);white-space:nowrap}
  .vig-table .plain-row td:not(.row-label){color:var(--text)}
  .vig-table .key-row td:not(.row-label){color:var(--warning)}
  .vig-table .cipher-row td:not(.row-label){color:var(--success)}

  /* Transposition grid */
  .trans-grid{border-collapse:collapse;font-family:var(--mono);font-size:13px}
  .trans-grid th{background:var(--surface3);color:var(--primary);font-weight:700;padding:6px 14px;border:1px solid var(--border2);font-size:11px}
  .trans-grid td{padding:6px 14px;border:1px solid var(--border2);text-align:center;color:var(--text)}
  .trans-grid .rank-row th{color:var(--warning);background:var(--surface2)}

  /* Info panel */
  .info-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
  .info-row:last-child{border-bottom:none}
  .info-label{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--text3);min-width:72px;padding-top:1px;text-transform:uppercase}
  .info-value{font-size:12px;color:var(--text2);line-height:1.5}
  .info-formula{font-family:var(--mono);font-size:12px;color:var(--primary)}

  /* About */
  .team-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
  .team-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
  .team-avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-dim);color:var(--primary);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
  .team-name{font-size:12px;font-weight:600;margin-bottom:3px;line-height:1.3}
  .team-roll{font-family:var(--mono);font-size:11px;color:var(--primary)}
  .team-extra{font-size:10px;color:var(--text3);margin-top:2px}

  /* Algo cards grid */
  .algo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
  .algo-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
  .algo-name{font-weight:700;font-size:14px;margin-bottom:4px}
  .algo-type{font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--primary);text-transform:uppercase;margin-bottom:8px}
  .algo-formula{font-family:var(--mono);font-size:11px;color:var(--text3)}

  /* Show steps toggle */
  .toggle-row{display:flex;align-items:center;gap:10px}
  .toggle{position:relative;width:36px;height:20px;cursor:pointer}
  .toggle input{opacity:0;width:0;height:0;position:absolute}
  .toggle-track{position:absolute;inset:0;background:var(--border2);border-radius:20px;transition:.2s}
  .toggle input:checked + .toggle-track{background:var(--primary)}
  .toggle-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
  .toggle input:checked ~ .toggle-thumb{left:18px}
  .toggle-label{font-size:12px;color:var(--text2);font-weight:500}

  /* Disclaimer */
  .disclaimer{background:var(--warning-dim);border:1px solid var(--warning);border-radius:var(--radius);padding:14px 18px;margin-top:24px}
  .disclaimer-title{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--warning);text-transform:uppercase;margin-bottom:4px}
  .disclaimer-body{font-size:12px;color:var(--text2)}

  /* Loading spinner */
  .spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Chip */
  .chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--text2)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useCallback, useRef} = React;
const API = '';

// ── Cipher metadata ────────────────────────────────────────────────────────
const CIPHERS = [
  {id:'caesar',      label:'Caesar',       icon:'①', tag:'Classical',      type:'Monoalphabetic Substitution', desc:'Fixed-shift substitution. Each letter shifted by constant integer key K.'},
  {id:'playfair',    label:'Playfair',     icon:'②', tag:'Polygraphic',    type:'Digraph Substitution',        desc:'Encrypts letter pairs using a 5×5 key matrix. I and J treated as identical.'},
  {id:'vigenere',    label:'Vigenère',     icon:'③', tag:'Polyalphabetic', type:'Polyalphabetic Substitution', desc:'Repeating keyword applies different Caesar shifts to each character.'},
  {id:'hill',        label:'Hill',         icon:'④', tag:'Linear Algebra', type:'Matrix Cipher',               desc:'Matrix multiplication mod 26. Requires key matrix invertible mod 26.'},
  {id:'transposition',label:'Transposition',icon:'⑤',tag:'Permutation',   type:'Columnar Transposition',      desc:'Rearranges columns by alphabetical rank of keyword letters.'},
];

const INFO = {
  caesar:       {encrypt:'C = (P + K) mod 26', decrypt:'P = (C − K) mod 26', key:'Any integer (positive or negative)', example:'HELLO + 3 = KHOOR'},
  playfair:     {encrypt:'Same row→right | Same col→down | Rect→swap cols', decrypt:'Same row→left | Same col→up | Rect→swap cols', key:'Alphabetic keyword (I≡J, X as filler)', example:'Key: MONARCHY'},
  vigenere:     {encrypt:'C = (P + Kᵢ) mod 26', decrypt:'P = (C − Kᵢ) mod 26', key:'Alphabetic keyword, repeated cyclically', example:'ATTACKATDAWN + LEMON = LXFOPVEFRNHR'},
  hill:         {encrypt:'C = K × P (mod 26)', decrypt:'P = K⁻¹ × C (mod 26)', key:'n×n matrix with gcd(det(K),26)=1', example:'[[3,3],[2,5]], HE → HI'},
  transposition:{encrypt:'Write rows → read columns by keyword rank', decrypt:'Fill columns by rank → read rows', key:'Alphabetic keyword (duplicates: left→right order)', example:'ZEBRAS + WEAREDISCOVERED'},
};

// ── Utilities ──────────────────────────────────────────────────────────────
async function callApi(endpoint, payload) {
  const r = await fetch(`${API}/api/${endpoint}`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload),
  });
  return r.json();
}

function Banner({type, msg, onClose}) {
  if (!msg) return null;
  const cls = {error:'banner-error',success:'banner-success',info:'banner-info',warning:'banner-warning'}[type]||'banner-error';
  const icons = {error:'✕',success:'✓',info:'ℹ',warning:'⚠'};
  return (
    <div className={`banner ${cls}`} style={{marginBottom:12}}>
      <span style={{flexShrink:0,fontWeight:700}}>{icons[type]||'!'}</span>
      <span style={{flex:1}}>{msg}</span>
      {onClose && <span style={{cursor:'pointer',opacity:.7}} onClick={onClose}>×</span>}
    </div>
  );
}

function CopyBtn({text}) {
  const [copied, setCopied] = useState(false);
  const copy = () => { navigator.clipboard?.writeText(text); setCopied(true); setTimeout(()=>setCopied(false),1500); };
  return <button className="btn btn-ghost btn-sm" onClick={copy}>{copied ? '✓ Copied' : '📋 Copy'}</button>;
}

function Toggle({checked, onChange, label}) {
  return (
    <div className="toggle-row">
      <label className="toggle">
        <input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)}/>
        <div className="toggle-track"/><div className="toggle-thumb"/>
      </label>
      <span className="toggle-label">{label}</span>
    </div>
  );
}

function InfoPanel({cipher}) {
  const info = INFO[cipher] || {};
  const meta = CIPHERS.find(c=>c.id===cipher) || {};
  return (
    <div>
      <div className="card" style={{marginBottom:16}}>
        <div className="card-header"><span className="card-title">Algorithm Info</span></div>
        <div className="card-body">
          {[['Type', meta.type],['Encrypt', info.encrypt],['Decrypt', info.decrypt],['Key', info.key],['Example', info.example]].map(([l,v])=>(
            <div className="info-row" key={l}>
              <div className="info-label">{l}</div>
              <div className={l==='Encrypt'||l==='Decrypt'?'info-formula':'info-value'}>{v}</div>
            </div>
          ))}
        </div>
      </div>
      <div className="disclaimer">
        <div className="disclaimer-title">⚠ Educational Use Only</div>
        <div className="disclaimer-body">Classical ciphers are for learning only. Do not use for real-world security.</div>
      </div>
    </div>
  );
}

// ── Caesar Steps ───────────────────────────────────────────────────────────
function CaesarSteps({data}) {
  if (!data?.length) return null;
  return (
    <div className="card">
      <div className="card-header"><span className="card-title">Step-by-Step</span></div>
      <div className="card-body" style={{padding:'12px 0'}}>
        <div style={{display:'grid',gridTemplateColumns:'80px 40px 80px 1fr',gap:'0 8px',alignItems:'center'}}>
          {['INPUT','→','OUTPUT','FORMULA'].map((h,i)=>(
            <div key={i} style={{padding:'4px 16px',fontSize:10,fontWeight:700,letterSpacing:1,color:'var(--text3)',textTransform:'uppercase'}}>{h}</div>
          ))}
          {data.map((s,i)=>(
            s.alpha ? [
              <div key={`a${i}`} style={{padding:'3px 16px',fontFamily:'var(--mono)',fontWeight:600}}>{s.in}</div>,
              <div key={`b${i}`} style={{padding:'3px 0',color:'var(--success)',textAlign:'center'}}>→</div>,
              <div key={`c${i}`} style={{padding:'3px 16px',fontFamily:'var(--mono)',color:'var(--primary)',fontWeight:600}}>{s.out}</div>,
              <div key={`d${i}`} style={{padding:'3px 16px',fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)'}}>{s.formula}</div>
            ] : [
              <div key={`a${i}`} style={{padding:'3px 16px',fontFamily:'var(--mono)',color:'var(--text3)'}}>{JSON.stringify(s.in)}</div>,
              <div key={`b${i}`} style={{padding:'3px 0',color:'var(--text3)',textAlign:'center'}}>→</div>,
              <div key={`c${i}`} style={{padding:'3px 16px',fontFamily:'var(--mono)',color:'var(--text3)'}}>{JSON.stringify(s.out)}</div>,

// ── Caesar Page ────────────────────────────────────────────────────────────
function CaesarPage() {
  const [text, setText] = useState('');
  const [shift, setShift] = useState('3');
  const [mode, setMode] = useState('encrypt');
  const [showSteps, setShowSteps] = useState(false);
  const [result, setResult] = useState('');
  const [steps, setSteps] = useState(null);
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState('');

  const run = async () => {
    setError(''); setSuccess(''); setResult(''); setSteps(null);
    if (!text.trim()) { setError('Input text cannot be empty.'); return; }
    if (isNaN(parseInt(shift))) { setError('Shift must be an integer.'); return; }
    setLoading(true);
    const d = await callApi('caesar', {text, shift:parseInt(shift), mode, showSteps});
    setLoading(false);
    if (d.error) { setError(d.error); return; }
    setResult(d.result);
    if (showSteps) setSteps(d.steps);
    setSuccess(`${mode==='encrypt'?'Encryption':'Decryption'} completed successfully.`);
  };

  return (
    <div className="cipher-page">
      <div className="cipher-header">
        <div className="cipher-header-row">
          <div className="cipher-title">Caesar Cipher</div>
          <div className="cipher-badge">Monoalphabetic Substitution</div>
        </div>
        <div className="cipher-desc">Fixed-shift substitution cipher. Each alphabetic character is shifted by constant integer K. Non-alphabetic characters are preserved.</div>
      </div>
      <div className="cipher-layout">
        <div className="cipher-main">
          <div className="card" style={{marginBottom:16}}>
            <div className="card-header"><span className="card-title">Configuration</span></div>
            <div className="card-body">
              <div style={{display:'flex',gap:24,alignItems:'flex-end',flexWrap:'wrap'}}>
                <div className="field" style={{margin:0}}>
                  <label className="field-label">Operation</label>
                  <div className="op-toggle" style={{width:240}}>
                    <div className={`op-btn ${mode==='encrypt'?'active':''}`} onClick={()=>{setMode('encrypt');setResult('');setSteps(null);setError('');setSuccess('');}}>ENCRYPT</div>
                    <div className={`op-btn ${mode==='decrypt'?'active':''}`} onClick={()=>{setMode('decrypt');setResult('');setSteps(null);setError('');setSuccess('');}}>DECRYPT</div>
                  </div>
                </div>
                <div className="field" style={{margin:0}}>
                  <label className="field-label">Shift Key</label>
                  <input className="input input-sm" value={shift} onChange={e=>setShift(e.target.value)} placeholder="e.g. 3" style={{fontFamily:'var(--mono)',fontSize:16,fontWeight:700,textAlign:'center'}}/>
                </div>
                <div style={{paddingBottom:1}}>
                  <Toggle checked={showSteps} onChange={v=>{setShowSteps(v);setSteps(null);}} label="Show Steps"/>
                </div>
              </div>
            </div>
          </div>

          <div className="card" style={{marginBottom:16}}>
            <div className="card-header"><span className="card-title">Input</span></div>
            <div className="card-body">
              <textarea className="input textarea" placeholder={mode==='encrypt'?'Enter plaintext here…':'Enter ciphertext here…'} value={text} onChange={e=>setText(e.target.value)} rows={5}/>
              {success && <Banner type="success" msg={success}/>}
              <div className="btn-row" style={{marginTop:10}}>
                <button className="btn btn-primary" onClick={run} disabled={loading} style={{minWidth:130}}>
                  {loading ? <><div className="spinner"/>{mode==='encrypt'?'Encrypting…':'Decrypting…'}</> : mode==='encrypt'?'⚡ Encrypt':'🔓 Decrypt'}
                </button>
              </div>
              <div style={{marginTop:16}}>
                <CipherOutput result={result} error={error} loading={loading}
                  onSwap={()=>{setText(result);setResult('');setSteps(null);setSuccess('');}}
                  onClear={()=>{setText('');setResult('');setSteps(null);setError('');setSuccess('');}}
                />
              </div>
            </div>
          </div>
          {showSteps && steps && <CaesarSteps data={steps}/>}
        </div>
        <div className="cipher-sidebar"><InfoPanel cipher="caesar"/></div>
      </div>
    </div>
  );
}

function PlayfairPage() {
  const [text, setText] = useState('');

  const [showSteps, setShowSteps] = useState(false);
  const [result, setResult] = useState('');
  const [stepsData, setStepsData] = useState(null);
  const [matrix, setMatrix] = useState(null);
  const [kwChars, setKwChars] = useState([]);
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState('');

  useEffect(() => {
    const kw = keyword.replace(/[^a-zA-Z]/g,'');
    if (!kw) return;
    callApi('playfair/matrix', {keyword:kw}).then(d => {
      if (!d.error) { setMatrix(d.matrix); setKwChars(d.kwChars); }
    });
  }, [keyword]);

  const run = async () => {
    setError(''); setSuccess(''); setResult(''); setStepsData(null);
    if (!text.trim()) { setError('Input text cannot be empty.'); return; }
    if (!keyword.replace(/[^a-zA-Z]/g,'')) { setError('Keyword must contain alphabetic characters.'); return; }
    setLoading(true);
    const d = await callApi('playfair', {text, keyword, mode, showSteps});
    setLoading(false);
    if (d.error) { setError(d.error); return; }
    setResult(d.result);
    if (showSteps && d.steps) { setStepsData(d.steps); setMatrix(d.steps.matrix); setKwChars(d.steps.kwChars); }
    else if (d.matrix) { setMatrix(d.matrix); }
    setSuccess(`${mode==='encrypt'?'Encryption':'Decryption'} completed successfully.`);
  };

  return (
    <div className="cipher-page">
      <div className="cipher-header">

          <div className="cipher-badge">Digraph Substitution</div>

              <div style={{display:'flex',gap:24,alignItems:'flex-start',flexWrap:'wrap'}}>
                <div className="field" style={{margin:0}}>
                  <label className="field-label">Operation</label>
                  <div className="op-toggle" style={{width:240}}>
                    <div className={`op-btn ${mode==='encrypt'?'active':''}`} onClick={()=>{setMode('encrypt');setResult('');setStepsData(null);setError('');setSuccess('');}}>ENCRYPT</div>
                    <div className={`op-btn ${mode==='decrypt'?'active':''}`} onClick={()=>{setMode('decrypt');setResult('');setStepsData(null);setError('');setSuccess('');}}>DECRYPT</div>
                  </div>
                </div>
                <div className="field" style={{margin:0}}>
                  <label className="field-label">Keyword (I ≡ J)</label>
                  <input className="input" style={{width:200}} value={keyword} onChange={e=>setKeyword(e.target.value.toUpperCase())} placeholder="e.g. MONARCHY"/>
                </div>
                <div style={{paddingTop:20}}>

              </div>

                <div style={{marginTop:20}}>
                  <div style={{fontSize:10,fontWeight:700,letterSpacing:1,color:'var(--text3)',textTransform:'uppercase',marginBottom:10}}>Key Matrix — {keyword.replace(/[^a-zA-Z]/g,'').toUpperCase() || '…'}</div>

                </div>
              )}
            </div>
          </div>
          <div className="card" style={{marginBottom:16}}>
            <div className="card-header"><span className="card-title">Input</span></div>
            <div className="card-body">
              <textarea className="input textarea" placeholder={mode==='encrypt'?'Enter plaintext…':'Enter ciphertext…'} value={text} onChange={e=>setText(e.target.value)} rows={4}/>

                </button>
              </div>
              <div style={{marginTop:16}}>

                />
              </div>
            </div>
          </div>
          {showSteps && stepsData && <PlayfairSteps data={stepsData}/>}
        </div>
        <div className="cipher-sidebar"><InfoPanel cipher="playfair"/></div>
      </div>
    </div>
  );

// ── Hill Page ──────────────────────────────────────────────────────────────
function HillPage() {
  const [text, setText] = useState('');
  const [size, setSize] = useState(2);
  const [matValues, setMatValues] = useState([[3,3],[2,5]]);
  const [mode, setMode] = useState('encrypt');
  const [showSteps, setShowSteps] = useState(false);
  const [result, setResult] = useState('');
  const [stepsData, setStepsData] = useState(null);
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState('');
  const [keyStatus, setKeyStatus] = useState(null);

  const defaults = {2:[[3,3],[2,5]], 3:[[6,24,1],[13,16,10],[20,17,15]]};

  const changeSize = (s) => {
    setSize(s); setMatValues(defaults[s]); setResult(''); setStepsData(null);
    setKeyStatus(null);
  };

  const updateCell = (r, c, v) => {
    const m = matValues.map(row=>[...row]);
    m[r][c] = v;
    setMatValues(m);
  };

  const checkKey = async () => {
    const intMat = matValues.map(row=>row.map(v=>parseInt(v)||0));
    const d = await callApi('hill/validate', {matrix:intMat});
    setKeyStatus(d);
  };

  const run = async () => {
    setError(''); setSuccess(''); setResult(''); setStepsData(null);
    if (!text.trim()) { setError('Input text cannot be empty.'); return; }
    const intMat = matValues.map(row=>row.map(v=>parseInt(v)||0));
    setLoading(true);
    const d = await callApi('hill', {text, matrix:intMat, mode, showSteps});
    setLoading(false);
    if (d.error) { setError(d.error); return; }
    setResult(d.result);
    if (showSteps && d.steps) setStepsData(d.steps);
    setSuccess(`${mode==='encrypt'?'Encryption':'Decryption'} completed successfully.`);
  };

  return (
    <div className="cipher-page">
      <div className="cipher-header">
        <div className="cipher-header-row">
          <div className="cipher-title">Hill Cipher</div>
          <div className="cipher-badge">Matrix Cipher</div>
        </div>
        <div className="cipher-desc">Matrix multiplication mod 26. Key matrix must be invertible mod 26 (gcd(det(K),26)=1). Supports 2×2 and 3×3.</div>
      </div>
      <div className="cipher-layout">
        <div className="cipher-main">
          <div className="card" style={{marginBottom:16}}>
            <div className="card-header"><span className="card-title">Configuration</span></div>
            <div className="card-body">
              <div style={{display:'flex',gap:24,alignItems:'flex-start',flexWrap:'wrap'}}>
                <div className="field" style={{margin:0}}>
                  <label className="field-label">Operation</label>
                  <div className="op-toggle" style={{width:240}}>
                    <div className={`op-btn ${mode==='encrypt'?'active':''}`} onClick={()=>{setMode('encrypt');setResult('');setStepsData(null);setError('');setSuccess('');}}>ENCRYPT</div>
                    <div className={`op-btn ${mode==='decrypt'?'active':''}`} onClick={()=>{setMode('decrypt');setResult('');setStepsData(null);setError('');setSuccess('');}}>DECRYPT</div>
                  </div>
                </div>
                <div className="field" style={{margin:0}}>
                  <label className="field-label">Matrix Size</label>
                  <div className="op-toggle" style={{width:160}}>
                    <div className={`op-btn ${size===2?'active':''}`} onClick={()=>changeSize(2)}>2 × 2</div>
                    <div className={`op-btn ${size===3?'active':''}`} onClick={()=>changeSize(3)}>3 × 3</div>
                  </div>
                </div>
                <div style={{paddingTop:20}}>
                  <Toggle checked={showSteps} onChange={v=>{setShowSteps(v);setStepsData(null);}} label="Show Steps"/>
                </div>
              </div>
              <div style={{marginTop:20}}>
                <label className="field-label">Key Matrix</label>
                <div className="matrix-editor" style={{gridTemplateColumns:`repeat(${size},56px)`,display:'inline-grid',gap:4}}>
                  {matValues.map((row,r)=>row.map((v,c)=>(
                    <input key={`${r}${c}`} className="matrix-input" value={v}
                      onChange={e=>updateCell(r,c,e.target.value)}
                      onBlur={checkKey}/>
                  )))}
                </div>
                <div style={{marginTop:10}}>
                  <button className="btn btn-ghost btn-sm" onClick={checkKey}>Validate Matrix</button>
                </div>
                {keyStatus && (
                  <div className={`key-status ${keyStatus.valid?'key-valid':'key-invalid'}`} style={{marginTop:8}}>
                    <div className="key-dot"/>
                    <span>{keyStatus.valid?'VALID KEY':'INVALID KEY'}  —  {keyStatus.message}</span>
                  </div>
                )}
              </div>
            </div>
          </div>
          <div className="card" style={{marginBottom:16}}>
            <div className="card-header"><span className="card-title">Input</span></div>
            <div className="card-body">
              <textarea className="input textarea" placeholder={mode==='encrypt'?'Enter plaintext…':'Enter ciphertext (uppercase alpha only)…'} value={text} onChange={e=>setText(e.target.value)} rows={4}/>
              {success && <Banner type="success" msg={success}/>}
              <div className="btn-row" style={{marginTop:10}}>
                <button className="btn btn-primary" onClick={run} disabled={loading} style={{minWidth:130}}>
                  {loading?<><div className="spinner"/>Processing…</>:mode==='encrypt'?'⚡ Encrypt':'🔓 Decrypt'}
                </button>
              </div>
              <div style={{marginTop:16}}>
                <CipherOutput result={result} error={error} loading={loading}
                  onSwap={()=>{setText(result);setResult('');setStepsData(null);setSuccess('');}}
                  onClear={()=>{setText('');setResult('');setStepsData(null);setError('');setSuccess('');setKeyStatus(null);}}
                />
              </div>
            </div>
          </div>
          {showSteps && stepsData && <HillSteps data={stepsData}/>}
        </div>
        <div className="cipher-sidebar"><InfoPanel cipher="hill"/></div>
      </div>
    </div>
  );
}

// ── Transposition Page ─────────────────────────────────────────────────────
function TranspositionPage() {
  const [text, setText] = useState('');
  const [keyword, setKeyword] = useState('ZEBRAS');
  const [mode, setMode] = useState('encrypt');
  const [showSteps, setShowSteps] = useState(false);
  const [result, setResult] = useState('');
  const [stepsData, setStepsData] = useState(null);
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState('');

  const run = async () => {
    setError(''); setSuccess(''); setResult(''); setStepsData(null);
    if (!text.trim()) { setError('Input text cannot be empty.'); return; }
    if (!keyword.replace(/[^a-zA-Z]/g,'')) { setError('Key must contain alphabetic characters.'); return; }
    setLoading(true);
    const d = await callApi('transposition', {text, keyword, mode, showSteps});
    setLoading(false);
    if (d.error) { setError(d.error); return; }
    setResult(d.result);
    if (showSteps && d.steps) setStepsData(d.steps);
    setSuccess(`${mode==='encrypt'?'Encryption':'Decryption'} completed successfully.`);
  };

  return (
    <div className="cipher-page">
      <div className="cipher-header">
        <div className="cipher-header-row">
          <div className="cipher-title">Transposition Cipher</div>
          <div className="cipher-badge">Columnar Transposition</div>
        </div>
        <div className="cipher-desc">Writes plaintext in rows; reads columns in alphabetical keyword-rank order. Duplicate letters ordered by position.</div>
      </div>
      <div className="cipher-layout">
        <div className="cipher-main">
          <div className="card" style={{marginBottom:16}}>
            <div className="card-header"><span className="card-title">Configuration</span></div>
            <div className="card-body">
              <div style={{display:'flex',gap:24,alignItems:'flex-end',flexWrap:'wrap'}}>
                <div className="field" style={{margin:0}}>
                  <label className="field-label">Operation</label>
                  <div className="op-toggle" style={{width:240}}>
                    <div className={`op-btn ${mode==='encrypt'?'active':''}`} onClick={()=>{setMode('encrypt');setResult('');setStepsData(null);setError('');setSuccess('');}}>ENCRYPT</div>
                    <div className={`op-btn ${mode==='decrypt'?'active':''}`} onClick={()=>{setMode('decrypt');setResult('');setStepsData(null);setError('');setSuccess('');}}>DECRYPT</div>
                  </div>
                </div>
                <div className="field" style={{margin:0}}>
                  <label className="field-label">Key</label>
                  <input className="input" style={{width:200}} value={keyword} onChange={e=>setKeyword(e.target.value.toUpperCase())} placeholder="e.g. ZEBRAS"/>
                </div>
                <div style={{paddingBottom:1}}>
                  <Toggle checked={showSteps} onChange={v=>{setShowSteps(v);setStepsData(null);}} label="Show Steps"/>
                </div>
              </div>
            </div>
          </div>
          <div className="card" style={{marginBottom:16}}>
            <div className="card-header"><span className="card-title">Input</span></div>
            <div className="card-body">
              <textarea className="input textarea" placeholder={mode==='encrypt'?'Enter plaintext…':'Enter ciphertext…'} value={text} onChange={e=>setText(e.target.value)} rows={4}/>
              {success && <Banner type="success" msg={success}/>}
              <div className="btn-row" style={{marginTop:10}}>
                <button className="btn btn-primary" onClick={run} disabled={loading} style={{minWidth:130}}>
                  {loading?<><div className="spinner"/>Processing…</>:mode==='encrypt'?'⚡ Encrypt':'🔓 Decrypt'}
                </button>
              </div>
              <div style={{marginTop:16}}>
                <CipherOutput result={result} error={error} loading={loading}
                  onSwap={()=>{setText(result);setResult('');setStepsData(null);setSuccess('');}}
                  onClear={()=>{setText('');setResult('');setStepsData(null);setError('');setSuccess('');}}
                />
              </div>
            </div>
          </div>
          {showSteps && stepsData && <TranspositionSteps data={stepsData}/>}
        </div>
        <div className="cipher-sidebar"><InfoPanel cipher="transposition"/></div>
      </div>
    </div>
  );
}
